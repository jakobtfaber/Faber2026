# Workflow-security audit configuration for `zizmor --pedantic`, run by the
# provenance job in .github/workflows/manuscript-provenance.yml.
#
# The only exemptions here cover .github/workflows/tend-*.yaml. Those files
# are generated by `uvx tend@latest init` and rewritten by tend's own nightly
# regeneration, so a hand-edit to satisfy an audit does not survive. Every
# hand-maintained workflow is still audited at full strength; as of the time
# of writing, all findings came from the generated files and none from
# manuscript-provenance.yml.
#
# Re-check what is actually being suppressed with:
#   uv run --project analysis --group test --frozen zizmor --pedantic .github/workflows
#
# Accepted risks, stated explicitly:
#
# - unpinned-uses: tend emits actions/checkout, astral-sh/setup-uv, and
#   max-sixty/tend/claude as tag references rather than commit hashes. A moved
#   tag would run unreviewed code in a job that can read the tend environment,
#   which holds the bot token and the Claude credential. Our own setup steps
#   are hash-pinned in .config/tend.yaml and are not covered by this exemption.
#
# - dangerous-triggers: tend-review uses pull_request_target and tend-ci-fix
#   uses workflow_run. Both are structural — the agent needs the tend
#   environment, which a plain pull_request run cannot reach. In both cases
#   GitHub runs the workflow file from the default branch, so a pull-request
#   author cannot alter what executes. The bot's own account has write and not
#   admin, and both main and every tag are admin-only, so nothing reached this
#   way can land on a protected reference.
#
# The remaining entries are style and hardening advice from the pedantic
# persona (job names, permission comments, concurrency groups, credential
# persistence) on files we do not author.
rules:
  unpinned-uses:
    ignore:
      - tend-review.yaml
      - tend-mention.yaml
      - tend-triage.yaml
      - tend-ci-fix.yaml
      - tend-nightly.yaml
      - tend-weekly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-install-test.yaml
  dangerous-triggers:
    ignore:
      - tend-review.yaml
      - tend-ci-fix.yaml
  excessive-permissions:
    ignore:
      - tend-review.yaml
      - tend-mention.yaml
      - tend-triage.yaml
      - tend-ci-fix.yaml
      - tend-nightly.yaml
      - tend-weekly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-install-test.yaml
  undocumented-permissions:
    ignore:
      - tend-review.yaml
      - tend-mention.yaml
      - tend-triage.yaml
      - tend-ci-fix.yaml
      - tend-nightly.yaml
      - tend-weekly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-install-test.yaml
  anonymous-definition:
    ignore:
      - tend-review.yaml
      - tend-mention.yaml
      - tend-triage.yaml
      - tend-ci-fix.yaml
      - tend-nightly.yaml
      - tend-weekly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-install-test.yaml
  concurrency-limits:
    ignore:
      - tend-review.yaml
      - tend-mention.yaml
      - tend-triage.yaml
      - tend-ci-fix.yaml
      - tend-nightly.yaml
      - tend-weekly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-install-test.yaml
  artipacked:
    ignore:
      - tend-review.yaml
      - tend-mention.yaml
      - tend-triage.yaml
      - tend-ci-fix.yaml
      - tend-nightly.yaml
      - tend-weekly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-install-test.yaml
  template-injection:
    ignore:
      - tend-review.yaml
      - tend-mention.yaml
      - tend-triage.yaml
      - tend-ci-fix.yaml
      - tend-nightly.yaml
      - tend-weekly.yaml
      - tend-notifications.yaml
      - tend-review-runs.yaml
      - tend-install-test.yaml
