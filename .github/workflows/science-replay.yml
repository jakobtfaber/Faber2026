name: Scheduled science replay

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-science-replay
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: analysis

jobs:
  scheduled-science-replay:
    name: scheduled-science-replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock
      - run: make test-slow
      - run: make test-replay
      - name: Exercise tests requiring non-repository scientific data
        continue-on-error: true
        run: make test-external
