name: Manuscript provenance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manuscript-provenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: route-analysis-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      analysis-pin: ${{ steps.diff.outputs.analysis-pin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "analysis-pin=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- analysis; then
            echo "analysis-pin=false" >> "$GITHUB_OUTPUT"
          else
            echo "analysis-pin=true" >> "$GITHUB_OUTPUT"
          fi

  provenance:
    name: provenance-details
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock
      - name: Verify manuscript, registry, figures, and tables
        run: make check-provenance
      - name: Validate workflow files
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
      - name: Scan workflow security
        run: uv run --project analysis --group test --frozen zizmor --pedantic .github/workflows
      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: false

  pinned-analysis-tests:
    name: pinned-analysis-tests
    needs: changes
    if: needs.changes.outputs.analysis-pin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock
      - run: make -C analysis ci

  required:
    name: manuscript-provenance
    if: always()
    needs: [changes, provenance, pinned-analysis-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every routed check
        env:
          CHANGES: ${{ needs.changes.result }}
          PROVENANCE: ${{ needs.provenance.result }}
          PINNED_ANALYSIS: ${{ needs.pinned-analysis-tests.result }}
        run: |
          test "$CHANGES" = success
          test "$PROVENANCE" = success
          test "$PINNED_ANALYSIS" = success -o "$PINNED_ANALYSIS" = skipped
