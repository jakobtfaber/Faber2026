name: Manuscript provenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manuscript-provenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: route-manuscript-suite
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      focused-only: ${{ steps.diff.outputs.focused-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "focused-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$HEAD_SHA^"
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
          changed_output=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          mapfile -t changed <<<"$changed_output"
          focused_only=true
          if [ "${#changed[@]}" -eq 0 ]; then
            focused_only=false
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              analysis/*|*.tex|bib/*.bib) ;;
              *) focused_only=false ;;
            esac
          done
          echo "focused-only=$focused_only" >> "$GITHUB_OUTPUT"

  manuscript:
    name: manuscript-focused
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify claim ownership and referenced paths
        run: |
          make check-manuscript
          python3 -m unittest discover -s tests -p 'test_manuscript_paths.py'
          python3 -m unittest discover -s tests -p 'test_scintillation_notebook.py'
          python3 -m unittest discover -s tests -p 'test_scintillation_notebook_imports.py'
      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: false

  provenance:
    name: provenance-details
    needs: changes
    if: needs.changes.outputs.focused-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch exact historical provenance objects
        run: python3 scripts/fetch_provenance_commits.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock
      - name: Verify manuscript, registry, figures, and tables
        run: make check-provenance
      - name: Run the manuscript test suite
        # The deselected four assert quarantine paths that #249 removed from
        # this repository, so they fail outright; whether to delete or repoint
        # them is the open decision in #331. The module's fifth test still
        # guards the manuscript root and stays in the run.
        run: >-
          uv run --project analysis --group test --frozen pytest tests
          --deselect=tests/test_outdated_science_quarantine.py::test_obsolete_tables_and_full_ledger_are_quarantined
          --deselect=tests/test_outdated_science_quarantine.py::test_active_propagation_ledger_is_fail_closed_only
          --deselect=tests/test_outdated_science_quarantine.py::test_generator_cannot_recreate_live_obsolete_tables
          --deselect=tests/test_outdated_science_quarantine.py::test_quarantine_has_review_index
      - name: Validate workflow files
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Scan workflow security
        run: uv run --project analysis --group test --frozen zizmor --pedantic .github/workflows

  required:
    name: manuscript-provenance
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, manuscript, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every routed check
        env:
          CHANGES: ${{ needs.changes.result }}
          MANUSCRIPT: ${{ needs.manuscript.result }}
          PROVENANCE: ${{ needs.provenance.result }}
        run: |
          test "$CHANGES" = success
          test "$MANUSCRIPT" = success
          test "$PROVENANCE" = success -o "$PROVENANCE" = skipped
