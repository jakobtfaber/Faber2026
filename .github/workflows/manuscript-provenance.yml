name: Manuscript provenance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manuscript-provenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: route-manuscript-suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      analysis-pin: ${{ steps.diff.outputs.analysis-pin }}
      prose-only: ${{ steps.diff.outputs.prose-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "analysis-pin=true" >> "$GITHUB_OUTPUT"
            echo "prose-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$HEAD_SHA^"
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- analysis; then
            echo "analysis-pin=false" >> "$GITHUB_OUTPUT"
          else
            echo "analysis-pin=true" >> "$GITHUB_OUTPUT"
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          prose_only=true
          if [ "${#changed[@]}" -eq 0 ]; then
            prose_only=false
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              *.tex|bib/*.bib) ;;
              *) prose_only=false ;;
            esac
          done
          echo "prose-only=$prose_only" >> "$GITHUB_OUTPUT"

  manuscript:
    name: manuscript-focused
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify claim ownership and referenced paths
        run: |
          make check-manuscript
          python3 -m unittest discover -s tests -p 'test_manuscript_paths.py'
      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: false

  provenance:
    name: provenance-details
    needs: changes
    if: needs.changes.outputs.prose-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock
      - name: Verify manuscript, registry, figures, and tables
        run: make check-provenance
      - name: Validate workflow files
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Scan workflow security
        run: uv run --project analysis --group test --frozen zizmor --pedantic .github/workflows

  pinned-analysis-tests:
    name: pinned-analysis-tests
    needs: changes
    if: needs.changes.outputs.analysis-pin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful continuous integration for the pinned analysis commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          analysis_repository="jakobtfaber/Faber2026-analysis"
          pin=$(git ls-tree HEAD analysis | awk '$1 == "160000" {print $3}')
          test ${#pin} -eq 40

          runs=$(gh run list \
            --repo "$analysis_repository" \
            --workflow analysis-ci.yml \
            --commit "$pin" \
            --limit 20 \
            --json databaseId,headSha,status,conclusion)
          run_id=$(jq -er --arg pin "$pin" '
            [.[] | select(.headSha == $pin)] | first | .databaseId
          ' <<<"$runs")
          gh run watch "$run_id" \
            --repo "$analysis_repository" \
            --exit-status \
            --interval 10
          checks=$(gh api "repos/${analysis_repository}/commits/${pin}/check-runs")
          jq -e '
            [.check_runs[] | select(
              .name == "analysis-ci" and
              .app.slug == "github-actions"
            )] | sort_by(.completed_at) | last | .conclusion == "success"
          ' <<<"$checks"

  required:
    name: manuscript-provenance
    if: always()
    needs: [changes, manuscript, provenance, pinned-analysis-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every routed check
        env:
          CHANGES: ${{ needs.changes.result }}
          MANUSCRIPT: ${{ needs.manuscript.result }}
          PROVENANCE: ${{ needs.provenance.result }}
          PINNED_ANALYSIS: ${{ needs.pinned-analysis-tests.result }}
        run: |
          test "$CHANGES" = success
          test "$MANUSCRIPT" = success
          test "$PROVENANCE" = success -o "$PROVENANCE" = skipped
          test "$PINNED_ANALYSIS" = success -o "$PINNED_ANALYSIS" = skipped
