name: Manuscript provenance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manuscript-provenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: route-analysis-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      analysis-pin: ${{ steps.diff.outputs.analysis-pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "analysis-pin=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- analysis; then
            echo "analysis-pin=false" >> "$GITHUB_OUTPUT"
          else
            echo "analysis-pin=true" >> "$GITHUB_OUTPUT"
          fi

  provenance:
    name: provenance-details
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock
      - name: Verify manuscript, registry, figures, and tables
        run: make check-provenance
      - name: Validate workflow files
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Scan workflow security
        run: uv run --project analysis --group test --frozen zizmor --pedantic .github/workflows
      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: false

  pinned-analysis-tests:
    name: pinned-analysis-tests
    needs: changes
    if: needs.changes.outputs.analysis-pin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful continuous integration for the pinned analysis commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          analysis_repository="jakobtfaber/Faber2026-analysis"
          pin=$(git ls-tree HEAD analysis | awk '$1 == "160000" {print $3}')
          test ${#pin} -eq 40

          runs=$(gh api \
            "repos/${analysis_repository}/actions/workflows/analysis-ci.yml/runs?head_sha=${pin}&event=push&status=success&per_page=100")
          run_id=$(jq -er --arg pin "$pin" '
            [.workflow_runs[] | select(
              .head_sha == $pin and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success" and
              .path == ".github/workflows/analysis-ci.yml"
            )] | sort_by(.run_number) | last | .id
          ' <<<"$runs")

          jobs=$(gh api "repos/${analysis_repository}/actions/runs/${run_id}/jobs?per_page=100")
          expected=$(printf '%s\n' \
            analysis-quality \
            analysis-tests \
            checkout-inventory-tests \
            dualband-aggregate \
            dualband-one-to-one-emg \
            dualband-one-to-one-gaussian \
            dualband-workflow-tests \
            dualband-wrong-chime-component-emg \
            dualband-wrong-chime-component-gaussian)
          test "$(jq '.total_count' <<<"$jobs")" -eq 9
          jq -e '
            [.jobs[] | select(
              .status != "completed" or .conclusion != "success"
            )] | length == 0
          ' <<<"$jobs"
          actual=$(jq -r '.jobs[].name' <<<"$jobs" | sort)
          test "$actual" = "$expected"

  required:
    name: manuscript-provenance
    if: always()
    needs: [changes, provenance, pinned-analysis-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every routed check
        env:
          CHANGES: ${{ needs.changes.result }}
          PROVENANCE: ${{ needs.provenance.result }}
          PINNED_ANALYSIS: ${{ needs.pinned-analysis-tests.result }}
        run: |
          test "$CHANGES" = success
          test "$PROVENANCE" = success
          test "$PINNED_ANALYSIS" = success -o "$PINNED_ANALYSIS" = skipped
