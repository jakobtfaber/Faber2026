name: tend-nightly
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  nightly:
    if: github.repository_owner == 'jakobtfaber'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        name: Set up Python
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        name: Set up uv
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock

      - uses: max-sixty/tend/claude@0.1.14
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: tend-jakobtfaber
          model: opus
          prompt: |
            /tend-ci-runner:nightly
