name: table-parity

# Table producers and project data live in the analysis submodule. Its lockfile
# supplies the exact reusable FLITS package revision.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Report the pair under test
        run: |
          echo "super-repo: $(git rev-parse --short HEAD)"
          echo "analysis pin: $(git -C analysis rev-parse --short HEAD)"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Parity tests
        run: |
          uv run --project analysis --frozen pytest -q \
            analysis/tests/test_verified_dm_manuscript.py \
            analysis/tests/test_provisional_propagation.py

      - name: Emitter output matches the manuscript's committed table
        run: |
          python analysis/scripts/render_dm_measurements_table.py --check
          python analysis/scripts/render_budget_table.py --check
