name: tend-ci-fix
on:
  workflow_run:
    workflows: ["Manuscript provenance"]
    types: [completed]
    branches: ["main"]

jobs:
  fix-ci:
    if: github.repository_owner == 'jakobtfaber' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        name: Set up Python
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        name: Set up uv
        with:
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock

      - uses: max-sixty/tend/claude@0.1.14
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: tend-jakobtfaber
          model: opus
          prompt: |
            /tend-ci-runner:ci-fix ${{ github.event.workflow_run.id }}
            - Run URL: ${{ github.event.workflow_run.html_url }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Commit message: ${{ github.event.workflow_run.head_commit.message }}
